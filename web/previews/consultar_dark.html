<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar pedido — Feira Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../app/static/css/main.css">
  
<link rel="stylesheet" href="../app/static/css/terminal.css">
<link rel="stylesheet" href="../app/static/css/loja-dark.css">

</head>
<body class="dark">
  
<div class="pagina-loja loja-consultar">
  <section class="consulta-bloco">
    <div class="consulta-titulo">
      <span class="marca-eyebrow">Feira Online</span>
      <h1>Consultar pedido</h1>
      <p>Use o número do pedido e o telefone da compra para verificar o status em segundos.</p>
    </div>
    <div class="cartao-formulario consulta-formulario">
      
        
      

      <form method="POST" action="/loja.consultar">
        <div class="campo">
          <label for="numero_pedido">Número do pedido</label>
          <input type="text" id="numero_pedido" name="numero_pedido" placeholder="Ex: F260802A1B2C" required autofocus>
        </div>
        <div class="campo">
          <label for="telefone">Telefone usado na compra</label>
          <input type="text" id="telefone" name="telefone" placeholder="82999990000" required>
        </div>
        <button type="submit" class="botao-primario">Consultar pedido</button>
      </form>

      <a class="link-voltar" href="/loja.catalogo">← Voltar para a loja</a>
    </div>
  </section>
</div>

  
</body>
</html>
