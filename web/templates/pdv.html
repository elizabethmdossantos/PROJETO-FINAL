<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV - Frente de Caixa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pdv-body">

    <header class="pdv-header" style="background-color: #1a365d; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center;">
        <div class="pdv-logo" style="font-weight: bold; font-size: 1.2rem;">🛒 ERP Comercial - Frente de Caixa</div>
        <div class="pdv-status">Operador: <strong>Admin</strong> | Caixa: <span style="background-color: #2f855a; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem;">Aberto</span></div>
    </header>

    <div class="pdv-container" style="display: flex; margin: 20px; gap: 20px; font-family: sans-serif;">
        
        <main class="pdv-main" style="flex: 2; background: #f7fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0;">
            <div class="search-box" style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #4a5568;">Pesquisa Multifuncional (Nome, Código ou Barras):</label>
                <input type="text" id="pdv-pesquisa" placeholder="Digite o produto ou use o leitor de código de barras..." autofocus style="width: 100%; padding: 12px; border-radius: 4px; border: 1px solid #cbd5e0; font-size: 1rem;">
            </div>

            <div class="table-container">
                <table id="tabela-venda" style="width: 100%; border-collapse: collapse; background: white;">
                    <thead>
                        <tr style="background-color: #edf2f7; border-bottom: 2px solid #cbd5e0;">
                            <th style="padding: 10px; text-align: left;">Item</th>
                            <th style="padding: 10px; text-align: left;">Código</th>
                            <th style="padding: 10px; text-align: left;">Descrição</th>
                            <th style="padding: 10px; text-align: center;">Qtd</th>
                            <th style="padding: 10px; text-align: right;">Vlr. Unit</th>
                            <th style="padding: 10px; text-align: right;">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="linha-vazia">
                            <td colspan="6" style="text-align: center; padding: 30px; color: #a0aec0; font-style: italic;">Nenhum produto bipado ou inserido na venda atual.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <aside class="pdv-sidebar" style="flex: 1; background: #edf2f7; padding: 20px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #cbd5e0;">
            
            <div class="total-box" style="background: #2b6cb0; color: white; padding: 20px; border-radius: 6px; text-align: center; margin-bottom: 20px;">
                <span style="font-size: 0.9rem; letter-spacing: 1px; display: block; margin-bottom: 5px;">TOTAL GERAL</span>
                <h1 id="total-geral" style="margin: 0; font-size: 2.5rem; font-weight: bold;">R$ 0,00</h1>
            </div>

            <div class="atalhos-box" style="background: white; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0;">
                <h3 style="margin-top: 0; font-size: 1rem; color: #2d3748; border-bottom: 1px solid #edf2f7; padding-bottom: 8px;">Formas de Pagamento (Atalhos)</h3>
                <ul style="list-style: none; padding: 0; margin: 10px 0; font-size: 0.9rem; color: #4a5568;">
                    <li style="margin-bottom: 8px;"><kbd style="background: #edf2f7; border: 1px solid #cbd5e0; border-radius: 3px; padding: 2px 6px; font-weight: bold;">F1</kbd> Dinheiro</li>
                    <li style="margin-bottom: 8px;"><kbd style="background: #edf2f7; border: 1px solid #cbd5e0; border-radius: 3px; padding: 2px 6px; font-weight: bold;">F2</kbd> Cartão</li>
                    <li style="margin-bottom: 8px;"><kbd style="background: #edf2f7; border: 1px solid #cbd5e0; border-radius: 3px; padding: 2px 6px; font-weight: bold;">F3</kbd> PIX</li>
                </ul>
                <hr style="border: 0; border-top: 1px solid #edf2f7; margin: 15px 0;">
                
                <button type="button" onclick="alert('Venda enviada para processamento na API do FastAPI!')" style="width: 100%; background: #38a169; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-bottom: 10px;">[F8] Concluir Venda</button>
                <a href="/dashboard" style="display: block; text-align: center; background: #718096; color: white; padding: 10px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.9rem;">Voltar ao Dashboard</a>
            </div>
        </aside>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
