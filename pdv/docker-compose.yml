services:
  mysql:
    image: mysql:8.0
    container_name: pdv_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-pdv_root_password}
      MYSQL_DATABASE: ${DB_NAME:-pdv_db}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - pdv_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pdv_mysql_data:
