<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Caixa — PDV Enxuto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="terminal.css">
</head>
<body>

<div class="terminal">
    <header class="terminal-header">
        <div>
            <span class="selo">Caixa #42 · caixa1</span>
            <h1>Terminal de venda</h1>
        </div>
        <a class="link-fechar" href="caixa.html">Ir para fechamento de caixa</a>
    </header>

    <div class="terminal-corpo">
        <section class="terminal-scanner">
            <label for="codigo-produto">Código do produto</label>
            <input
                type="text"
                id="codigo-produto"
                placeholder="Digite ou bipe o código e pressione Enter"
                autofocus
                autocomplete="off"
            >
            <div id="mensagem-scanner" class="mensagem-scanner"></div>

            <table class="tabela-carrinho">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Produto</th>
                        <th>Qtd.</th>
                        <th>Preço unit.</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="corpo-carrinho">
                    <tr id="linha-vazia">
                        <td colspan="6" class="carrinho-vazio">Nenhum item ainda — digite um código acima.</td>
                    </tr>

                    </tbody>
            </table>
        </section>

        <aside class="terminal-resumo">
            <div class="recibo">
                <div class="recibo-linha recibo-total">
                    <span>Total</span>
                    <span id="valor-total">R$ 0,00</span>
                </div>
                <hr>
                <p class="rotulo-pagamento">Forma de pagamento</p>
                <div class="opcoes-pagamento" id="opcoes-pagamento">
                    <button type="button" class="opcao-pagamento" data-forma="pix">Pix</button>
                    <button type="button" class="opcao-pagamento" data-forma="cartao">Cartão</button>
                    <button type="button" class="opcao-pagamento" data-forma="vale_refeicao">Vale-refeição</button>
                </div>
                <button type="button" id="botao-finalizar" class="botao-entrar" disabled>
                    Finalizar venda
                </button>
                <div id="mensagem-venda" class="mensagem-scanner"></div>
            </div>
        </aside>
    </div>
</div>

<script src="js/pdv.js"></script>
</body>
</html>
